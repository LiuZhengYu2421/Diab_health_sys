# 云端大模型 LLM config（OpenAI 兼容接口，如 DeepSeek / 通义千问 / 文心一言）
# 后端所有 AI 功能改为直接调用云端大模型，替换原 Dify 服务
# base-url 填写 OpenAI 兼容接口地址（末尾一般含 /v1，后端自动拼接 /chat/completions）
llm.base-url=https://api.deepseek.com/v1
llm.api-key=sk-你的deepseek-api-key
llm.model=deepseek-chat
llm.timeout-ms=60000

